# REGION Overlay

Окно поверх игры: поиск по правилам, быстрые ответы, биндер. Открывается и скрывается горячей клавишей (по умолчанию **Alt+R**).

## Запуск
1. Установите Node.js 20+ → дважды щёлкните `start.bat` (или `npm install && npm start`).
2. Подключение одним ключом: на сайте откройте профиль, раздел «Оверлей для игры», нажмите «Создать ключ» и откройте оверлей: он сам найдёт ключ в буфере обмена (или вставьте его в «Настройки»). Адрес сайта зашит в ключ, вводить его не нужно. Данные подгрузятся и сохранятся на диск, дальше работает и без сети.

Готовый установщик/portable `.exe`: `npm run dist` на Windows (результат в `dist/`) или workflow «Сборка для Windows» в GitHub Actions.

## Сервер (RegionWiki)
На сайте работают `src/app/api/overlay/version` и `download` (автообновление), `src/app/api/overlay/data/route.ts` (правила и быстрые ответы), `.../punishments/*` (наказания), `.../me` (проверка ключа). Правила отдаются открыто (как на сайте), всё остальное только по личному ключу и в рамках прав его владельца.
Если сайт стоит за прокси и адрес в ключе получается неверным, задайте на сервере `OVERLAY_SITE_URL` (например `https://wiki.example.ru`). Общий `OVERLAY_TOKEN` остаётся только для старых версий оверлея.

## Как пользоваться
- **Всё.** Общий поиск по правилам, быстрым ответам и биндам сразу (вкладка открывается первой). Enter — действие над выбранным (правило: копировать номер, ответ: копировать, бинд: отправить в игру), Shift+Enter — правило с текстом.
- **Правила.** «ОП 1.19» или «1.19» — по номеру; «ограбить», «баг» — по словам (учитываются окончания). Фильтр по разделам, ↑/↓ — выбор, Enter — копировать «ОП 1.19», Shift+Enter — с текстом, клик по карточке копирует «ОП 1.19», кнопка ▾ разворачивает наказание, примечания и исключения.
- **Ответы.** Клик по блоку ответа (или Enter) копирует текст ответа. Можно включить «Вставлять сразу» — после копирования окно скроется и в игру вставится Ctrl+V.
- **Биндер.** «+ Бинд»: название, сочетание клавиш, текст (строка = сообщение). Бинд срабатывает по горячей клавише прямо в игре: для каждой строки нажимается клавиша чата (если задана), вставляется текст и жмётся Enter. Клавиша чата и пауза задаются глобально в настройках или на каждый бинд.
- **Подсказки на экране игры.** Маленькая прозрачная панель со списком биндов («Ctrl+Alt+1 — Приветствие ×2») висит поверх игры и не перехватывает мышь. Включается в «Настройках» или клавишей **Alt+H**; там же угол экрана, размер и прозрачность. Строка вспыхивает, когда бинд срабатывает. Бинд можно исключить из панели галочкой в его настройках.
- **Свёрнутый режим.** Кнопка ⤡ в шапке (или Ctrl+M) сворачивает оверлей в одну строку поиска: логотип, поле, переключатель «Всё / Правила / Ответы», история запросов и кнопка ⤢ для возврата. Когда вы вводите запрос, строка выпадает вниз списком результатов, а когда очищаете, снова сжимается. Положение и режим запоминаются, Alt+R открывает оверлей в том режиме, в котором вы его оставили.
- Esc — скрыть (или очистить поиск). Ctrl+1…5 — вкладки, Ctrl+6 — «Наказания». Окно двигается за шапку, размер и позиция запоминаются.

- **Наказания.** Кнопка с молотком и счётчиком есть в строке поиска, в шапке и на левой панели разделов. Внутри три вкладки: «Очередь» (старые заявки сверху, цветом подсвечено, сколько заявка ждёт), «В работе у меня» (карточка с шагами: взято → решение → команда → выдано, главная кнопка всегда одна) и «Мои заявки» с фильтром по статусу. Новая заявка открывается в боковой панели, Esc закрывает её.

- **Уведомления о наказаниях.** Новая заявка, взятие в работу, выдача и отказ приходят карточкой поверх игры. Карточка не забирает фокус, на ней можно сразу нажать «Взять в работу», «Копировать ID» или «Открыть». Если заявку взял кто-то другой, карточка сама исчезает. Вид (поверх игры или системное уведомление Windows), угол экрана и кнопка «Показать пробное уведомление» есть в «Настройках».

- **Быстрые клавиши наказаний.** Работают прямо в игре, ответ приходит карточкой. По умолчанию: **Alt+Q** берёт самую старую заявку из очереди (Static ID сразу копируется), **Alt+W** копирует команду заявки в работе, **Alt+E** отмечает «Выдал наказание» (только после копирования команды), **Alt+P** открывает «Наказания». Сочетания меняются и очищаются в «Настройках». На самой вкладке: 1–3 переключают списки, ↑/↓ (или J/K) выбирают карточку, Enter делает следующий шаг, C копирует Static ID, N открывает новую заявку, R обновляет.

- **Ещё про наказания.** Кнопка «В заявку» на карточке правила добавляет пункт в новую заявку и подставляет вид и срок из наказания пункта (например «/jail 30 минут»). Быстрые клавиши перед действием заново запрашивают данные с сайта, так что заявка, которую успели забрать, не будет взята повторно. Уведомления можно заглушить режимом «Не беспокоить» (в меню и в настройках), есть короткий звуковой сигнал при новой заявке (отключается).

- **Решение из уведомления и повторные нарушители.** После «Взять в работу» карточка сама ведёт по шагам: «Одобрить» или «Отклонить…» (с причиной), «Копировать команду», «Выдал наказание», без открытия оверлея. Для ввода причины окно на время получает фокус, потом отдаёт его обратно. Если на тот же Static ID уже есть другие заявки (в очереди, в работе или ваши), в карточке и в списке появляется жёлтая метка «повтор».

- **Закрепления и черновик.** Звёздочка на карточке правила закрепляет его на главной (клик по закреплённому копирует номер). На закрытой карточке сразу видны наказания пункта. Заявка на наказание сохраняется как черновик: если закрыть форму по Esc или перезапустить оверлей, введённое вернётся; кнопка «Очистить» стирает его. В очереди есть фильтр по виду наказания.

- **Тур и звуки.** При первом запуске оверлей показывает короткий тур: панель разделов, звёздочка на правиле, наказания и клавиши (Enter или → дальше, ← назад, Esc закрыть). Повторить его можно из меню или из «Настроек». Звуки у событий разные: новая заявка, «взяли в работу», «выдано» и «отказ»; громкость и кнопки пробного прослушивания есть в «Настройках». Подтверждения быстрых клавиш молчат.

- **Автообновление.** Оверлей раз в 6 часов (и по кнопке «Проверить» в «Настройках → Обновления») спрашивает у сайта свежую версию. Новая версия скачивается сама, проверяется контрольная сумма, и файл подменяется при выходе из программы или по кнопке «Обновить и перезапустить» (есть карточка-уведомление и баннер на главной). Автоустановка работает для **portable-версии на Windows**; у версии из установщика и в режиме разработки показывается только сообщение о новой версии.
  Что нужно на сайте: скопировать в проект два маршрута из папки `server-snippets/` (`version-route.ts` → `src/app/api/overlay/version/route.ts`, `download-route.ts` → `src/app/api/overlay/download/route.ts`). Они берут самый свежий `REGION Overlay-X.Y.Z.exe` из папки `overlay-downloads`; рядом можно положить `REGION Overlay-X.Y.Z.txt` с описанием изменений. Выпуск версии: поднять `version` в `package.json`, запустить `build.bat portable` и положить файл в `overlay-downloads`. Скачивание разрешено только с того же сайта и только `.exe`.

## Важно
- Игра должна идти в режиме **«в окне» или «окно без рамок»**: поверх настоящего полноэкранного режима окна не рисуются.
- Вставка и биндер работают на Windows (PowerShell + SendKeys). Если игра запущена от администратора, запускайте оверлей тоже от администратора, иначе Windows не даст ему нажимать клавиши.
- Не ставьте на бинд сочетание, которое уже использует игра: глобальная клавиша перехватывается оверлеем. Занятые сочетания подсвечиваются красным.
- Чат-команды вроде `/mute …` в биндах отправляются как обычные строки; убедитесь, что античит сервера допускает автоматический ввод.

## Сборка .exe

Запустите **build.bat** двойным кликом: он поставит зависимости, прогонит тесты и соберёт приложение в папку `dist`
(portable `.exe` и установщик). `build.bat portable` собирает только один файл без установки, `build.bat installer` только установщик.
Нужен Node.js LTS. Запуск без сборки: **start.bat**. Сообщения в окне сборки английские: так cmd.exe не ломается на кодировке.

## Резервная копия настроек

«Настройки → Общее → Сохранить настройки в файл» записывает настройки и бинды в JSON, «Загрузить из файла» возвращает их обратно (например, на другом компьютере). В файл не попадают личный ключ, адрес сайта и положение окон. При загрузке принимаются только известные настройки с правильным типом значения, остальное пропускается, а их число показывается в уведомлении.

## Вид подсказок биндера

В «Настройки → Подсказки биндера» можно выключить фон (останется текст с тёмной обводкой), менять размер текста (60–250%), прозрачность фона и прозрачность всего блока вместе с текстом. Пока подсказки не зафиксированы, они показываются полностью, чтобы их было удобно перетаскивать.

## Журнал действий

На вкладке «Наказания → Журнал» записываются ваши действия: взял в работу, одобрил, отклонил (с причиной), скопировал команду, выдал, вернул в очередь, подал заявку. Записи группируются по дням, ищутся по Static ID или номеру заявки и хранятся только на этом компьютере (последние 500, файл `actions.json` в папке данных программы). Кнопка «Очистить» стирает журнал после повторного нажатия. Пишутся и действия из уведомлений и быстрых клавиш.

На главной под баннером очереди показывается сводка смены за сегодня (взято, выдано, отклонено, подано) по журналу; нажатие открывает журнал.

## Enter после ввода в биндере

В форме бинда есть переключатель «Нажимать Enter после ввода». Он включён по умолчанию (как и раньше: каждая строка отправляется). Если выключить, между строками Enter по-прежнему нажимается, а последняя строка остаётся в поле чата, чтобы вы могли её поправить и отправить сами. В списке такие бинды помечены «без Enter».

## Плотность, анимации, сообщения

- «Настройки → Окно и горячие клавиши → Компактные списки» (и пункт в меню ≡) уменьшает отступы карточек правил, ответов и наказаний, чтобы на экране помещалось больше.
- Карточки, плитки и кнопки плавно появляются и откликаются на нажатие. Список наказаний анимируется только при смене вкладки, а не при каждом опросе сайта. Если в системе включено «уменьшить движение», анимации отключаются.
- Пустые состояния и ошибки оформлены одним блоком: серый — пусто, жёлтый — нужно действие или нет связи, красный — ошибка. Для наказаний различаются «Ключ не подошёл», «Нет связи с сайтом» (старые данные остаются на экране) и прочие ошибки.

## Настройки по разделам

Настройки разбиты на шесть разделов: «Подключение», «Окно и клавиши», «Наказания», «Подсказки в игре», «Обновления», «Общее». Слева список разделов, справа выбранный; в узком окне список превращается в горизонтальную ленту. Последний открытый раздел запоминается. Красная точка у раздела значит, что нужно действие: нет ключа, есть готовое обновление или клавиша не назначилась. Кнопки «Открыть настройки» в сообщениях открывают нужный раздел сразу.

## Безопасность
- **Ключ доступа** хранится в `settings.json` только в зашифрованном виде (Electron `safeStorage`, в Windows это DPAPI). Окно программы получает вместо ключа маску, настоящий ключ остаётся в главном процессе. Старый файл с открытым ключом при запуске переписывается автоматически.
- **Адрес сайта** берётся из ключа и принимается только по `https://` (`http://` лишь для localhost при разработке). Новый сайт всегда подтверждается в окне. Чтобы разрешить только свой домен, впишите его в `trusted-hosts.json`: `{ "hosts": ["wiki.example.ru"] }`; тогда сборка откажется подключаться к любому другому сайту.
- **Обновления подписаны.** Программа ставит только тот файл, чья подпись Ed25519 сходится с вшитым `update-key.pub`. Без подписи или с неверной обновление не скачивается.

### Выпуск подписанной версии
1. Один раз: `npm run keygen` создаёт `release-private.pem` (секретный, не коммитить, сделайте копию) и `update-key.pub` (коммитить: он вшивается в сборку). Без `update-key.pub` автообновление в сборке отключено.
2. Соберите portable-файл `REGION Overlay-X.Y.Z.exe` (`build.bat portable`).
3. `npm run sign -- "dist/REGION Overlay-X.Y.Z.exe"` создаёт рядом `REGION Overlay-X.Y.Z.exe.sig`.
4. Положите `.exe` и `.exe.sig` в папку `overlay-downloads` на сайте (рядом можно `REGION Overlay-X.Y.Z.txt` с описанием изменений). Маршруты `/api/overlay/version` и `/api/overlay/download` уже есть на сайте и принимают ключ программы.
5. В GitHub Actions подпись ставится автоматически, если задан секрет `RELEASE_SIGNING_KEY` (содержимое `release-private.pem`).
